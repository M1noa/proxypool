name: fetch proxies

on:
  schedule:
    # four slots for one hourly run. the extras are not extra runs — the guard
    # job below drops them — they are redundancy against github dropping the
    # fire, which is the thing that actually made runs sparse.
    #
    # none of them are on the hour. "0 * * * *" is the most contended minute
    # there is and github drops scheduled fires it cannot place: this repo
    # measured 36 fires across 151h, one every 4.33h against a nominal 1h,
    # arriving 1-56 min past. that is not a repo-side fault — the same cron
    # delivered 0.81-1.57h gaps on aug 26 — so the answer is redundancy, not a
    # different single minute. each expression is registered and throttled on its
    # own, so four slots are four independent chances rather than one.
    - cron: "2 * * * *"
    - cron: "17 * * * *"
    - cron: "32 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # this is where the hourly cadence actually gets enforced. four slots would
  # otherwise mean four full runs an hour — 150-odd upstream endpoints swept four
  # times for a list that decays with a ~3h half-life — and a run republishing 15
  # min after the last one also distorts the sources table: the proxypool row's
  # success column is retention measured across the gap between runs, so a short
  # gap flatters it. this job answers in seconds and gates on the gap.
  #
  # it sits outside the concurrency group on purpose. the group was workflow-level
  # and only ever keeps one run pending — a third arrival cancels the pending one,
  # which is where 19 of the last 60 runs went. skipped slots now cost the group
  # no time at all.
  guard:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "manual run, not gated"
            echo "due=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # the publish step force-pushes the output branch every run, so that
          # commit's date is the last publish. no branch means none yet.
          last=$(gh api "repos/${{ github.repository }}/commits/output" \
                   --jq .commit.committer.date 2>/dev/null) || last=""
          if [ -z "$last" ]; then
            echo "no output branch yet, running"
            echo "due=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          age=$(( ($(date -u +%s) - $(date -u -d "$last" +%s)) / 60 ))
          echo "last publish $last, ${age}m ago"
          # 45, not 60, for an hourly cadence: this age is measured from the last
          # publish and the next run adds its own 6-10 min on top. slots are 15
          # min apart so the first one at or past 45 lands in [45,60), putting
          # consecutive publishes 53-68 min apart. 60 here would drift to ~65+.
          if [ "$age" -ge 45 ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false (next slot)" >> "$GITHUB_OUTPUT"
          fi

  fetch:
    needs: guard
    if: needs.guard.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: fetch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: CGO_ENABLED=1 go build -o bin/proxypool ./cmd/proxypool

      - name: restore history
        run: |
          mkdir -p output
          curl -fsSL --remove-on-error -o output/history.duckdb \
            "https://raw.githubusercontent.com/${{ github.repository }}/output/history.duckdb" \
            || echo "no prior history, starting fresh"

      - name: fetch, check, write outputs
        run: ./bin/proxypool

      - name: commit readme
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "update readme stats ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git pull --rebase -X ours origin main
            git push origin HEAD:main
          else
            echo "no readme changes"
          fi

      - name: publish outputs
        # orphan temp repo force-pushed every run: output branch always has 1 commit
        run: |
          work=$(mktemp -d)
          cp output/proxies.json output/history.duckdb "$work/"
          git -C "$work" init -q
          git -C "$work" config user.name "github-actions[bot]"
          git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$work" add proxies.json history.duckdb
          git -C "$work" commit -qm "outputs $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git -C "$work" remote add origin \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git -C "$work" push -qf origin HEAD:refs/heads/output
