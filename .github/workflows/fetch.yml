name: fetch proxies

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install deps
        run: pip install -r requirements.txt

      - name: fetch, check, write outputs
        run: python3 fetch_proxies.py

      - name: commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "update proxy lists ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            # outputs are fully regenerated each run: ours always wins
            git pull --rebase -X ours origin main
            git push origin HEAD:main
          else
            echo "no changes to outputs"
          fi
          else
            echo "no changes to outputs"
          fi

      - name: publish history
        run: |
          gzip -9 -c output/history.db > /tmp/history.db.gz
          work=$(mktemp -d)
          cp /tmp/history.db.gz "$work/"
          git -C "$work" init -q
          git -C "$work" config user.name "github-actions[bot]"
          git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$work" add history.db.gz
          git -C "$work" commit -qm "history $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git -C "$work" remote add origin \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git -C "$work" push -qf origin HEAD:refs/heads/history
