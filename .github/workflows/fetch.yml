name: fetch proxies

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install deps
        run: pip install -r requirements.txt

      - name: fetch, check, write outputs
        run: python3 fetch_proxies.py

      - name: commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/
          git add README.md
          if git diff --cached --quiet; then
            echo "no changes to outputs"
          else
            git commit -m "update proxy lists ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
