name: fetch proxies

on:
  schedule:
    # twelve slots for roughly one run every 45 min. the extras are not extra
    # runs — the guard job below drops them in a few seconds — they exist because
    # github's scheduled events are best-effort and this repo measured how
    # best-effort: on a single "0 * * * *", 36 fires across 151h, one every 4.33h
    # against a nominal 1h, 23% delivery. they arrived at minutes 1 through 56,
    # so they were being delayed rather than cleanly dropped, and it drifted —
    # 0.81-1.57h gaps on aug 26, then 9.8h, 10.9h, 11.6h.
    #
    # nothing in a workflow file can make github fire on time. what more slots
    # buy is that a delayed or dropped one costs 5 minutes instead of an hour.
    # offset by 3 to stay off :00, which the docs name as the high-load window,
    # and off the :15/:30/:45 marks everyone else rounds to.
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
    inputs:
      gated:
        # an external scheduler dispatching on its own cron wants the same
        # cadence gate a scheduled fire gets, otherwise every dispatch is a full
        # run. a human clicking "run workflow" wants the run they asked for, so
        # the default is off and only the caller opts in.
        description: respect the cadence gate instead of running now
        type: boolean
        default: false

permissions:
  contents: write
  actions: read # guard reads this workflow's own run status

jobs:
  # the cadence lives here, not in the cron. twelve slots would otherwise mean
  # twelve full runs an hour — 150-odd upstream endpoints swept twelve times for a
  # list that decays with a ~3h half-life — and republishing minutes after the
  # last run also distorts the sources table, since the proxypool row's success
  # column is retention measured across the gap between runs and a short gap
  # flatters it. this job answers in seconds and gates on that gap, so a slot is
  # cheap enough to offer every five minutes.
  #
  # it sits outside the concurrency group on purpose. that group only ever keeps
  # one run pending, so a third arrival cancels the pending one. skipped slots now
  # cost the group no time at all and cancel nothing.
  guard:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          GATED: ${{ inputs.gated }}
        run: |
          set -uo pipefail
          due() { echo "due=$1" >> "$GITHUB_OUTPUT"; exit 0; }

          # empty on a schedule event, where the first test already decided
          if [ "$EVENT" != "schedule" ] && [ "$GATED" != "true" ]; then
            echo "manual run, not gated"
            due true
          fi

          # a slot landing mid-run reads a publish timestamp that run has not
          # written yet, clears the age check below, and queues a duplicate behind
          # the concurrency group to republish a minute later. at twelve slots an
          # hour against a 6-10 min run that is nearly every cycle.
          #
          # the tie-break is on run id, which is monotonic: between two guards
          # racing only the newer backs off, so this can never talk both out of a
          # slot. an in-flight fetch always has the lower id, which is the case
          # that matters.
          active=$(gh run list --repo "$REPO" --workflow fetch.yml --limit 30 \
                     --json databaseId,status \
                     --jq '.[] | select(.status != "completed") | .databaseId') || active=""
          for id in $active; do
            if [ "$id" -lt "$RUN_ID" ]; then
              echo "run $id still in flight, backing off"
              due false
            fi
          done

          # the publish step force-pushes the output branch every run, so that
          # commit's date is the last publish. no branch means none yet.
          last=$(gh api "repos/$REPO/commits/output" \
                   --jq .commit.committer.date 2>/dev/null) || last=""
          if [ -z "$last" ]; then
            echo "no output branch yet, running"
            due true
          fi
          age=$(( ($(date -u +%s) - $(date -u -d "$last" +%s)) / 60 ))
          echo "last publish $last, ${age}m ago"
          # 35 targets a ~45 min cadence while guaranteeing the hourly floor. the
          # age is measured from the last publish and the next run adds its own
          # 6-10 min on top, so with slots 5 min apart the first one at or past 35
          # lands in [35,40) and consecutive publishes fall 41-50 min apart. the
          # margin to 60 is deliberate: it absorbs four consecutive dropped slots
          # before the cadence slips past an hour, and slots do get dropped.
          if [ "$age" -ge 35 ]; then
            due true
          fi
          echo "not due, waiting for the next slot"
          due false

  fetch:
    needs: guard
    if: needs.guard.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: fetch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: CGO_ENABLED=1 go build -o bin/proxypool ./cmd/proxypool

      - name: restore history
        run: |
          mkdir -p output
          curl -fsSL --remove-on-error -o output/history.duckdb \
            "https://raw.githubusercontent.com/${{ github.repository }}/output/history.duckdb" \
            || echo "no prior history, starting fresh"

      - name: fetch, check, write outputs
        run: ./bin/proxypool

      - name: commit readme
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "update readme stats ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git pull --rebase -X ours origin main
            git push origin HEAD:main
          else
            echo "no readme changes"
          fi

      - name: publish outputs
        # orphan temp repo force-pushed every run: output branch always has 1 commit
        run: |
          work=$(mktemp -d)
          cp output/proxies.json output/history.duckdb "$work/"
          git -C "$work" init -q
          git -C "$work" config user.name "github-actions[bot]"
          git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$work" add proxies.json history.duckdb
          git -C "$work" commit -qm "outputs $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git -C "$work" remote add origin \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git -C "$work" push -qf origin HEAD:refs/heads/output
